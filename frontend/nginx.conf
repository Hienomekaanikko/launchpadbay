server {
  listen 443 ssl;
  ssl_certificate	/run/tls/frontend.pem;
  ssl_certificate_key	/run/tls/frontend-key.pem;

  location = /api/metrics {
    return 404; #TODO: should we add a 404 page? This isn't it, it just blocking public access to metrics.
  }

  location /api/ {
    proxy_pass https://backend:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_ssl_trusted_certificate	/run/tls/ca.pem;
    proxy_ssl_verify	on;

    # Allow WebSocket upgrade requests
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}

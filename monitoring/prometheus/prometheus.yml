global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus #REMOVE: prometheus monitoring itself
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: backend #REMOVE: prometheus monitoring backend
    scheme: https
    metrics_path: /metrics
    tls_config:
      ca_file: /etc/prometheus/certs/ca.pem
    static_configs:
      - targets: ["backend:3000"]
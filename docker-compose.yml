services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p\"$$MYSQL_ROOT_PASSWORD\" --silent" ]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 30s

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: "mysql://dj:greatestdj@mysql:3306/launchpadbay"
    # ports:
    #   - "3000:3000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./certs/backend.pem:/run/tls/backend.pem:ro
      - ./certs/backend-key.pem:/run/tls/backend-key.pem:ro
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8443:443"
    volumes:
      - ./certs/frontend.pem:/run/tls/frontend.pem:ro
      - ./certs/frontend-key.pem:/run/tls/frontend-key.pem:ro
      - ./certs/ca.pem:/run/tls/ca.pem:ro
    depends_on:
      - backend

volumes:
  mysql_data:
